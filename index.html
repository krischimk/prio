<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--
      Tastatur: `interactive-widget=overlays-content` ist hier entscheidend.

      In der Android-App verkleinert Capacitor die Ansicht bereits selbst um die
      Tastaturhöhe (SystemBars setzt Padding auf die DecorView). Die
      Android-WebView tut das standardmäßig zusätzlich – der Inhalt würde also
      zweimal verkleinert und über der Tastatur bliebe ein großer leerer
      Bereich. Mit `overlays-content` überlässt die WebView die Anpassung dem
      nativen Teil.

      Ältere WebViews kennen das Attribut nicht und ignorieren es; dort bleibt
      es beim bisherigen Verhalten.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta name="description" content="Offline-first To-do-App mit gemeinsamen Listen und Cloud-Synchronisation." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('prio:theme') === 'light' ? 'light' : 'dark' } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Prio</title>
  </head>
  <body>
    <div id="root"><div style="min-height:100dvh;display:flex;align-items:center;justify-content:center" role="status" aria-label="Prio wird gestartet"><img class="app-icon-dark" src="/icons/icon-192.png" alt="Prio" width="80" height="80" /><img class="app-icon-light" src="/icons/icon-light-192.png" alt="Prio" width="80" height="80" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
