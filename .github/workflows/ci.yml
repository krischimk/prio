name: CI

# Läuft bei jedem Push und jedem Pull Request.
#
# Wichtig: Die Pipeline benötigt KEINE Supabase-Secrets. Alle Tests laufen mit
# Fakes bzw. gegen einen lokalen Mock-Server (tests/mock-supabase), und der
# Produktionsbuild kommt ohne Zugangsdaten aus.
#
# Der Job `deploy` veröffentlicht zusätzlich die Web-Fassung nach Cloudflare
# Pages – aber nur nach grünen Tests. `main` landet als Produktion auf
# prio-krischi.pages.dev, jeder andere Zweig als Vorschau-Adresse
# (<hash>.prio-krischi.pages.dev). So lässt sich ein Fix vor dem
# Zusammenführen ansehen, statt ihn sofort allen hinzustellen. Fehlt der Zugang
# (Secret `CLOUDFLARE_API_TOKEN`, Variable `CLOUDFLARE_ACCOUNT_ID`), wird der
# Job übersprungen statt rot: Das Repository soll nicht bei jedem Push meckern,
# solange Cloudflare noch nicht eingerichtet ist.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      android_smoke:
        description: Nur die native Android-Prüfung mit Telefonbildern ausführen
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: inputs.android_smoke != true
    name: Typecheck, Lint, Unit-/Integrationstests, Build
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Linting
        run: npm run lint

      - name: Unit-Tests
        run: npm run test:unit

      - name: Integrationstests
        run: npm run test:integration

      - name: Produktionsbuild
        run: npm run build

  e2e:
    if: inputs.android_smoke != true
    name: E2E-Tests (Playwright, Teil ${{ matrix.teil }}/2)
    # Zwei Teil-Läufe auf zwei Rechnern: Die Suite selbst bleibt seriell (der
    # Mock hält gemeinsamen Zustand), über Rechner hinweg geht es aber parallel.
    # Die Wartezeit halbiert sich, ohne dass ein Test entfällt.
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Der Browser wird zwischengespeichert: Sonst kostet der Download in
      # jedem Lauf und in jedem Teil-Lauf eine knappe Minute.
      - name: Playwright-Browser zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests
        run: npm run test:e2e -- --shard=${{ matrix.teil }}/2

      - name: Playwright-Bericht hochladen (nur bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database:
    if: inputs.android_smoke != true
    name: Geschützte Schreibvorgänge (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prio-test-only
          POSTGRES_DB: prio_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRIO_DB_TEST_URL: postgresql://postgres:prio-test-only@127.0.0.1:5432/prio_test_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: PostgreSQL-Client einrichten
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Datenbank-Zeitgeber einrichten
        run: |
          docker exec -i ${{ job.services.postgres.id }} bash <<'SETUP'
          set -e
          apt-get update
          apt-get install -y postgresql-16-cron
          cat >> "$PGDATA/postgresql.conf" <<'CONFIG'
          shared_preload_libraries='pg_cron'
          cron.database_name='prio_test_ci'
          cron.use_background_workers=on
          CONFIG
          SETUP
          docker restart ${{ job.services.postgres.id }}
          for attempt in $(seq 1 30); do
            if docker exec ${{ job.services.postgres.id }} pg_isready; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Migrationen, Rechte, Konflikte und Retry prüfen
        run: npm run db:test

  android:
    name: Android-App im Emulator (manuelle Release-Prüfung)
    if: inputs.android_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: e2e-publishable-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - name: SDK und APK bereitstellen
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          npm run android:apk
      # Empfehlung des Emulator-Runners: Ubuntu und KVM-Zugriff explizit
      # einrichten. Der lokale Sandbox-Lauf hat kein /dev/kvm.
      - name: KVM für den Emulator freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Kernabläufe und Telefonbilder prüfen
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          script: node tests/android/smoke.mjs
      - name: Native Bilder und Protokolle sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke
          path: test-results/android/
          retention-days: 14

  # Die Web-Fassung. Anders als beim Bauen in Cloudflare selbst läuft sie erst
  # nach den Tests – eine ungeprüfte Fassung kann so nicht online gehen.
  # Der veröffentlichte Stand ist genau das Bundle, das hier gebaut und geprüft
  # wurde.
  deploy:
    name: Web-Fassung zu Cloudflare Pages
    needs: [quality, e2e, database]
    # Jeder Zweig wird veröffentlicht: `main` als Produktion, alles andere als
    # Vorschau-Adresse (<hash>.prio-krischi.pages.dev). Damit lässt sich ein Fix
    # vor dem Zusammenführen ansehen, statt ihn allen sofort hinzustellen.
    #
    # `workflow_dispatch` ist mit dabei, damit sich das auch von Hand auslösen
    # lässt – nützlich, wenn nur geprüft werden soll, ob die Rauchprüfung greift.
    if: inputs.android_smoke != true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Eine Zeitgrenze je Job: Hängt ein Schritt (bisher: apt-get im
    # Browser-Installationsschritt), läuft er sonst bis zum GitHub-Limit von
    # sechs Stunden weiter und der Lauf bleibt „in Arbeit“.
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Zugang prüfen
        id: zugang
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "bereit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Kein Cloudflare-Zugang hinterlegt – die Web-Fassung wird nicht veröffentlicht."
          else
            echo "bereit=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.zugang.outputs.bereit == 'true'
        uses: actions/checkout@v7

      - if: steps.zugang.outputs.bereit == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - if: steps.zugang.outputs.bereit == 'true'
        name: Abhängigkeiten installieren
        run: npm ci

      - if: steps.zugang.outputs.bereit == 'true'
        name: Web-Bundle bauen
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Repository-Variable VITE_SUPABASE_URL fehlt."; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Repository-Variable VITE_SUPABASE_PUBLISHABLE_KEY fehlt."; exit 1; }
          npm run build
          # Sicherheitsnetz wie im Release: Lieber nichts veröffentlichen als
          # eine Fassung, die nicht synchronisieren kann.
          grep -q "$VITE_SUPABASE_URL" dist/assets/*.js \
            || { echo "::error::Die Supabase-URL steckt nicht im Web-Bundle."; exit 1; }

      # Der Projektname ist zugleich die Adresse: <name>.pages.dev. Nur wenn
      # dieser Name weltweit noch frei ist, entsteht genau sie – sonst hängt
      # Cloudflare Zufallszeichen an, und die Adresse ist nicht mehr zu merken.
      # Deshalb wird hier geprüft statt geschluckt: Ein belegter Name soll
      # sichtbar scheitern und nicht still eine kryptische Adresse erzeugen.
      - if: steps.zugang.outputs.bereit == 'true'
        name: Projekt anlegen (nur beim ersten Mal)
        run: |
          PROJEKT="prio-krischi"
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -qE "(^|[[:space:]])$PROJEKT([[:space:]]|$)"; then
            echo "Projekt $PROJEKT ist vorhanden."
          else
            npx --yes wrangler@4 pages project create "$PROJEKT" --production-branch=main
          fi
          npx --yes wrangler@4 pages project list 2>/dev/null | grep -qE "(^|[[:space:]])$PROJEKT([[:space:]]|$)" \
            || { echo "::error::Projekt $PROJEKT fehlt und ließ sich nicht anlegen – ist der Name vergeben?"; exit 1; }

      - if: steps.zugang.outputs.bereit == 'true'
        name: Hochladen
        run: npx --yes wrangler@4 pages deploy dist --project-name=prio-krischi --branch="${{ github.ref_name }}"

      # Die veröffentlichte Fassung prüft sich selbst: anmelden, Liste und
      # Aufgabe anlegen, Abgleich abwarten. Damit fällt auf, was nur beim
      # Nutzer sichtbar wird – ein Bündel, das nicht startet, eine fehlende
      # Spalte (PGRST204), eine verletzte Zugriffsregel.
      #
      # Nur für die Produktion und nur, wenn die Secrets liegen; sonst ein
      # Hinweis statt eines roten Laufs (wie beim Cloudflare-Zugang).
      - if: |
          steps.zugang.outputs.bereit == 'true' &&
          github.ref == 'refs/heads/main'
        name: Playwright-Browser zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: |
          steps.zugang.outputs.bereit == 'true' &&
          github.ref == 'refs/heads/main'
        name: Veröffentlichte Fassung rauchen
        # `--with-deps` ruft apt-get auf; das hing am 07.10.2026 über zwanzig
        # Minuten und ließ den Lauf „in Arbeit“ stehen, obwohl die Fassung
        # längst veröffentlicht war. Die Grenze macht daraus einen sichtbaren
        # Fehlschlag nach sechs Minuten statt eines Hängers bis zum Stundenlimit.
        timeout-minutes: 6
        env:
          PRIO_TEST_A_EMAIL: ${{ secrets.PRIO_TEST_A_EMAIL }}
          PRIO_TEST_A_PASSWORT: ${{ secrets.PRIO_TEST_A_PASSWORT }}
        run: |
          if [ -z "$PRIO_TEST_A_EMAIL" ] || [ -z "$PRIO_TEST_A_PASSWORT" ]; then
            echo "::notice::Kein Testkonto hinterlegt (PRIO_TEST_A_EMAIL/PASSWORT) – die Rauchprüfung entfällt."
            exit 0
          fi
          npx playwright install --with-deps chromium
          npm run smoke:live
