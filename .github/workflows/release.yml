name: Release

# Erzeugt bei jedem Versions-Tag (z. B. v0.2.0) ein GitHub-Release mit
# fertig signierter APK zum Herunterladen.
#
# Warum signiert und nicht als Debug-Build?
#   Android verweigert ein Update, wenn die Signatur nicht zur bereits
#   installierten App passt. Eine Debug-APK bekäme auf jedem CI-Rechner einen
#   neu erzeugten Schlüssel – jedes Update müsste also erst deinstalliert
#   werden. Deshalb wird hier mit einem festen Schlüssel signiert, der als
#   Repository-Secret hinterlegt ist.
#
# Benötigte Secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  # Erlaubt einen Probelauf ohne Tag – die APK landet dann nur als Artefakt.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK bauen und veröffentlichen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          # Ohne die volle Historie fehlt der Tag-Text, und genau der ist der
          # Changelog des Releases.
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Wichtig: JDK 21, nicht das Standard-JDK des Runners – das Android
      # Gradle Plugin unterstützt kein JDK 22+.
      - name: JDK 21 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android-Pakete installieren
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Abhängigkeiten installieren
        run: npm ci

      # Erst prüfen, dann veröffentlichen: Ein Tag soll keine ungetestete
      # Fassung als Release erzeugen.
      - name: Typecheck, Linting und Tests
        run: npm run typecheck && npm run lint && npm run test

      - name: Versionsnummer aus dem Tag ableiten
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

          # Tag und package.json müssen dieselbe Version nennen: Den versionCode
          # rechnet android/app/build.gradle aus package.json aus. Laufen beide
          # auseinander, trägt die APK eine Version, die nicht zu ihrem Tag
          # passt – und die Update-Prüfung in der App vergleicht genau die.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            pkg=$(node -p "require('./package.json').version")
            if [ "$pkg" != "$name" ]; then
              echo "::error::Tag v$name passt nicht zu package.json ($pkg)."
              exit 1
            fi
          fi

      # Erst die Migration, dann die App-Version, die sie braucht. Fehlt
      # serverseitig eine Spalte, die die App sendet, scheitert jeder Sync mit
      # PGRST204 – genau das ist bei 0.18.0 passiert. Die Prüfung bricht den
      # Release ab, statt eine unbrauchbare APK zu veröffentlichen.
      - name: Migrationen prüfen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::Kein SUPABASE_DB_URL hinterlegt – die Migrationsprüfung entfällt."
            exit 0
          fi
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          # Erreichbarkeit getrennt prüfen: Ein Netzwerkproblem des Runners sagt
          # nichts über den Datenbankstand. Vorher brach genau das einen Release
          # ab ("Network is unreachable" für die IPv6-Adresse des Projekts),
          # obwohl alle Spalten vorhanden waren. Die Prüfung selbst bleibt
          # scharf, sobald die Datenbank antwortet.
          if ! psql "$SUPABASE_DB_URL" -tAc 'select 1' >/dev/null 2>&1; then
            echo "::warning::Datenbank aus dem Runner nicht erreichbar – Migrationsprüfung übersprungen. Bitte lokal 'npm run db:check' laufen lassen (die Regel dazu steht in AGENTS.md)."
            exit 0
          fi
          npm run db:check

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/prio-release.keystore"
          test -s "$RUNNER_TEMP/prio-release.keystore"

      - name: Web-Bundle bauen und APK signieren
        env:
          # Die App bekommt die Supabase-Konfiguration zur BUILD-Zeit einkompiliert.
          # Ohne diese beiden Werte entsteht eine App, die beim Start nur
          # "Supabase ist nicht konfiguriert" anzeigt – deshalb stammen sie aus
          # Repository-Variablen (beide Werte sind öffentlich, sie stecken
          # ohnehin in jeder ausgelieferten App) und werden unten geprüft.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          PRIO_KEYSTORE_FILE: ${{ runner.temp }}/prio-release.keystore
          PRIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PRIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PRIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PRIO_VERSION_NAME: ${{ steps.version.outputs.name }}
          # Der versionCode wird NICHT hier gesetzt. Er kommt aus derselben
          # Formel wie bei lokal gebauten Fassungen (siehe
          # android/app/build.gradle). Vorher stand hier github.run_number –
          # das lag unter dem versionCode der Emulator-Fassung, und Android
          # lehnt ein Update mit kleinerem versionCode als "Downgrade" ab.
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Repository-Variable VITE_SUPABASE_URL fehlt."; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Repository-Variable VITE_SUPABASE_PUBLISHABLE_KEY fehlt."; exit 1; }

          npm run build

          # Sicherheitsnetz: Lieber kein Release als eine App, die nicht
          # synchronisieren kann.
          grep -q "$VITE_SUPABASE_URL" dist/assets/*.js \
            || { echo "::error::Die Supabase-URL steckt nicht im Web-Bundle."; exit 1; }

          npx cap sync android
          cd android
          ./gradlew assembleRelease

      - name: APK benennen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "prio-${{ steps.version.outputs.name }}.apk"

      - name: Release veröffentlichen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Der Text der Tag-Anmerkung ist der Changelog. GitHub kann ihn nicht
          # selbst erzeugen: Ohne Pull Requests bleibt bei `--generate-notes`
          # nur ein Verweis auf den Vergleich zweier Tags, und das ist keine
          # lesbare Liste. Der Tag-Text wird deshalb beim Setzen des Tags
          # geschrieben – siehe AGENTS.md.
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Der Tag ${GITHUB_REF_NAME} hat keinen Text – bitte mit -m annotieren." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "prio-${{ steps.version.outputs.name }}.apk" \
            --title "Prio ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md

      - name: APK als Artefakt sichern (Probelauf ohne Tag)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: prio-apk
          path: '*.apk'
          retention-days: 14
